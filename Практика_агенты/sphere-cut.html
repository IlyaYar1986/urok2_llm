<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сечение сферы плоскостью</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    #canvas-container { position: fixed; inset: 0; }
    canvas { display: block; }

    /* UI Panel */
    #panel {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(10, 10, 30, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 16px;
      padding: 16px 24px; display: flex; gap: 20px; align-items: center;
      z-index: 10; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      user-select: none; -webkit-user-select: none;
    }

    .mode-group { display: flex; gap: 4px; }
    .mode-btn {
      padding: 6px 14px; border: 1px solid rgba(255,255,255,0.18); background: transparent;
      color: rgba(255,255,255,0.65); border-radius: 8px; cursor: pointer;
      font-size: 0.73rem; font-weight: 500; transition: all 0.25s; white-space: nowrap;
      font-family: inherit;
    }
    .mode-btn:hover { border-color: rgba(255,255,255,0.4); color: #fff; background: rgba(255,255,255,0.05); }
    .mode-btn.active { background: #7c5cfc; border-color: #7c5cfc; color: #fff; }

    .slider-group { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .slider-group label { color: rgba(255,255,255,0.55); font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
    input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 130px; height: 4px;
      background: rgba(255,255,255,0.15); border-radius: 2px; outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 15px; height: 15px; background: #7c5cfc;
      border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 8px rgba(124,92,252,0.5);
    }
    input[type="range"]::-moz-range-thumb {
      width: 15px; height: 15px; background: #7c5cfc; border-radius: 50%;
      cursor: pointer; border: 2px solid #fff;
    }

    .play-btn {
      width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2);
      background: transparent; color: #fff; cursor: pointer; display: flex;
      align-items: center; justify-content: center; font-size: 0.9rem; transition: all 0.25s;
      flex-shrink: 0;
    }
    .play-btn:hover { background: rgba(124,92,252,0.3); border-color: #7c5cfc; }
    .play-btn.playing { background: #7c5cfc; border-color: #7c5cfc; }

    /* Responsive: stack on narrow screens */
    @media (max-width: 640px) {
      #panel { flex-wrap: wrap; gap: 12px; padding: 12px 16px; border-radius: 12px; }
      input[type="range"] { width: 90px; }
      .mode-btn { font-size: 0.7rem; padding: 5px 10px; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="panel">
    <div class="mode-group" id="mode-buttons">
      <button class="mode-btn active" data-mode="0">Прозрачный</button>
      <button class="mode-btn" data-mode="1">Отсечение</button>
      <button class="mode-btn" data-mode="2">Каркасный</button>
    </div>
    <div class="slider-group">
      <label>Высота сечения</label>
      <input type="range" id="height-slider" min="-100" max="100" value="0" step="1">
    </div>
    <button class="play-btn" id="play-btn" title="Автоанимация">▶</button>
  </div>

  <!-- Three.js import map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ── Scene ──
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a1a);
    scene.fog = new THREE.Fog(0x0a0a1a, 8, 20);

    // ── Camera ──
    const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(3.5, 2.2, 5);
    camera.lookAt(0, 0, 0);

    // ── Renderer ──
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.localClippingEnabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    // ── Lights ──
    const ambientLight = new THREE.AmbientLight(0x404068, 2.0);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 4);
    keyLight.position.set(5, 8, 5);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x8888ff, 2.0);
    fillLight.position.set(-3, 1, -2);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xff8866, 1.5);
    rimLight.position.set(0, -1, 3);
    scene.add(rimLight);

    // ── OrbitControls ──
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 2.5;
    controls.maxDistance = 12;
    controls.update();

    // ── Subtle ground grid ──
    const gridHelper = new THREE.GridHelper(6, 20, 0x333355, 0x1a1a33);
    gridHelper.position.y = -1.8;
    scene.add(gridHelper);

    // ── Constants ──
    const SPHERE_RADIUS = 1.5;
    const SPHERE_SEGMENTS = 64;

    // ── Sphere group ──
    const sphereGroup = new THREE.Group();
    scene.add(sphereGroup);

    // ── Plane visual (semi-transparent purple disc) ──
    const planeGeometry = new THREE.CircleGeometry(2.2, 80);
    const planeMaterial = new THREE.MeshBasicMaterial({
      color: 0x7c5cfc,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.38,
      depthWrite: false,
    });
    const planeVisual = new THREE.Mesh(planeGeometry, planeMaterial);
    planeVisual.rotation.x = -Math.PI / 2;
    planeVisual.renderOrder = 1;
    scene.add(planeVisual);

    // ═══════════════════════════════════════════
    // ── Three sphere meshes (one per mode) ──
    // ═══════════════════════════════════════════
    const sphereGeo = new THREE.SphereGeometry(SPHERE_RADIUS, SPHERE_SEGMENTS, SPHERE_SEGMENTS);

    // Mode 0: Transparent
    const sphereMatTransparent = new THREE.MeshPhysicalMaterial({
      color: 0x4488ff,
      roughness: 0.25,
      metalness: 0.05,
      transparent: true,
      opacity: 0.33,
      depthWrite: false,
      side: THREE.FrontSide,
    });
    const sphereTransparent = new THREE.Mesh(sphereGeo, sphereMatTransparent);
    sphereTransparent.visible = true;

    // Mode 1: Clipped (opaque)
    const sphereMatClipped = new THREE.MeshStandardMaterial({
      color: 0x4488ff,
      roughness: 0.28,
      metalness: 0.08,
      side: THREE.FrontSide,
      clippingPlanes: [],
      clipShadows: true,
    });
    const sphereClipped = new THREE.Mesh(sphereGeo, sphereMatClipped);
    sphereClipped.visible = false;

    // Mode 2: Wireframe
    const sphereMatWire = new THREE.MeshBasicMaterial({
      color: 0x6699ff,
      wireframe: true,
      transparent: true,
      opacity: 0.65,
    });
    const sphereWire = new THREE.Mesh(sphereGeo, sphereMatWire);
    sphereWire.visible = false;

    sphereGroup.add(sphereTransparent);
    sphereGroup.add(sphereClipped);
    sphereGroup.add(sphereWire);

    // ═══════════════════════════════════════════
    // ── Intersection curve ──
    // ═══════════════════════════════════════════
    const curveGroup = new THREE.Group();
    scene.add(curveGroup);

    // Torus ring (for modes 0 transparent and 1 clipped)
    const torusGeo = new THREE.TorusGeometry(SPHERE_RADIUS, 0.035, 32, 160);
    const torusMat = new THREE.MeshBasicMaterial({ color: 0xff6644, depthTest: true, depthWrite: true });
    const torusRing = new THREE.Mesh(torusGeo, torusMat);
    torusRing.rotation.x = Math.PI / 2;
    curveGroup.add(torusRing);

    // Wireframe ellipse points (for mode 2)
    const ellipsePoints = new Array(161);
    for (let i = 0; i <= 160; i++) {
      const angle = (i / 160) * Math.PI * 2;
      ellipsePoints[i] = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));
    }
    const ellipseGeo = new THREE.BufferGeometry().setFromPoints(ellipsePoints);
    const ellipseLine = new THREE.Line(
      ellipseGeo,
      new THREE.LineBasicMaterial({ color: 0xff6644, linewidth: 2, depthTest: true })
    );
    curveGroup.add(ellipseLine);
    ellipseLine.renderOrder = 2;

    // ═══════════════════════════════════════════
    // ── Clipping planes ──
    // ═══════════════════════════════════════════
    const clipPlaneAbove = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
    const clipPlaneBelow = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

    // ═══════════════════════════════════════════
    // ── Update: position plane + curve by height ──
    // ═══════════════════════════════════════════
    function updatePlaneHeight(normalizedHeight) {
      // normalizedHeight: -1..1 → -SPHERE_RADIUS..+SPHERE_RADIUS
      const y = normalizedHeight * SPHERE_RADIUS;
      planeVisual.position.y = y;

      // Intersection radius (circle radius at this cut height)
      const absY = Math.abs(y);
      const intersectRadius = absY < SPHERE_RADIUS
        ? Math.sqrt(SPHERE_RADIUS * SPHERE_RADIUS - y * y)
        : 0;

      // Update torus ring
      if (intersectRadius > 0.008) {
        torusRing.visible = currentMode !== 1;
        torusRing.scale.setScalar(intersectRadius / SPHERE_RADIUS);
        torusRing.position.y = y;
      } else {
        torusRing.visible = false;
      }

      // Update wireframe ellipse
      if (intersectRadius > 0.008) {
        ellipseLine.visible = currentMode === 2;
        ellipseLine.scale.set(intersectRadius, 1, intersectRadius);
        ellipseLine.position.y = y;
      } else {
        ellipseLine.visible = false;
      }

      // Update clipping planes (mode 1)
      clipPlaneAbove.constant = y;
      clipPlaneBelow.constant = -y;
      sphereMatClipped.clippingPlanes = [clipPlaneAbove, clipPlaneBelow];
    }

    // ═══════════════════════════════════════════
    // ── Mode switching ──
    // ═══════════════════════════════════════════
    let currentMode = 0;
    const modeButtons = document.querySelectorAll('.mode-btn');

    function setMode(mode) {
      currentMode = mode;
      modeButtons.forEach(b => b.classList.toggle('active', +b.dataset.mode === mode));

      // Sphere visibility
      sphereTransparent.visible = mode === 0;
      sphereClipped.visible = mode === 1;
      sphereWire.visible = mode === 2;

      if (mode === 1) {
        // Clipping mode
        renderer.clippingPlanes = [clipPlaneAbove, clipPlaneBelow];
        torusRing.visible = false;
        ellipseLine.visible = false;
        planeVisual.material.opacity = 0.55;
        sphereMatTransparent.depthWrite = true;
      } else {
        renderer.clippingPlanes = [];
        planeVisual.material.opacity = 0.38;
        sphereMatTransparent.depthWrite = false;
      }

      // Refresh curve visibility for current height
      updatePlaneHeight(parseFloat(heightSlider.value) / 100);
    }

    modeButtons.forEach(btn => {
      btn.addEventListener('click', () => setMode(+btn.dataset.mode));
    });

    // ═══════════════════════════════════════════
    // ── Slider ──
    // ═══════════════════════════════════════════
    const heightSlider = document.getElementById('height-slider');
    heightSlider.addEventListener('input', () => {
      updatePlaneHeight(parseFloat(heightSlider.value) / 100);
    });

    // ═══════════════════════════════════════════
    // ── Play / Pause ──
    // ═══════════════════════════════════════════
    let playing = false;
    let playDirection = 1;
    const playBtn = document.getElementById('play-btn');

    playBtn.addEventListener('click', () => {
      playing = !playing;
      playBtn.classList.toggle('playing', playing);
      playBtn.textContent = playing ? '⏸' : '▶';
    });

    // ═══════════════════════════════════════════
    // ── Keyboard controls ──
    // ═══════════════════════════════════════════
    window.addEventListener('keydown', (e) => {
      switch (e.key.toLowerCase()) {
        case '1': setMode(0); break;
        case '2': setMode(1); break;
        case '3': setMode(2); break;
        case ' ': e.preventDefault(); playBtn.click(); break;
        case 'arrowleft':
          heightSlider.value = Math.max(-100, +heightSlider.value - 5);
          updatePlaneHeight(parseFloat(heightSlider.value) / 100);
          break;
        case 'arrowright':
          heightSlider.value = Math.min(100, +heightSlider.value + 5);
          updatePlaneHeight(parseFloat(heightSlider.value) / 100);
          break;
      }
    });

    // ═══════════════════════════════════════════
    // ── Resize handler ──
    // ═══════════════════════════════════════════
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // ── Initial state ──
    updatePlaneHeight(0);
    setMode(0);

    // ═══════════════════════════════════════════
    // ── Animation loop ──
    // ═══════════════════════════════════════════
    function animate() {
      requestAnimationFrame(animate);

      if (playing) {
        let val = parseFloat(heightSlider.value) / 100 + playDirection * 0.007;
        if (val >= 1) { val = 1; playDirection = -1; }
        if (val <= -1) { val = -1; playDirection = 1; }
        heightSlider.value = Math.round(val * 100);
        updatePlaneHeight(val);
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    console.log('✅ Sphere-cut ready | Modes: 1/2/3 | Space: play | ← →: height');
  </script>
</body>
</html>
